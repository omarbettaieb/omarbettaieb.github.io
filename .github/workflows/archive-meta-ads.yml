name: Archive Meta creative previews into draft branch
on:
  push:
    branches:
      - portfolio-growth-marketing-20261025
    paths:
      - .github/workflows/archive-meta-ads.yml
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-growth-marketing-20261025
          persist-credentials: true
      - name: Prepare image converter
        run: python -m pip install --quiet Pillow
      - name: Fetch and store six original Meta creative previews
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import sys
          import urllib.request
          from PIL import Image, ImageOps
          
          items = json.loads("[{\"id\":\"120236213139520179\",\"name\":\"omega3-video-poster\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t15.5256-10/610690596_1634261641089496_2075476840578086301_n.jpg?_nc_cat=110&ccb=1-7&_nc_ohc=b_8wmYJ8OTMQ7kNvwFA6OUZ&_nc_oc=AdrN4233iXD-hP5jho7YkXmZOJKzhdYrGOeruwaKoL07HBfxGky6Vyp8IjlbucMhlbM&_nc_zt=23&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=YeL7OgzdRNFBBlEfYcp5VA&_nc_tpa=Q5bMBQLmUPkOaZPgJRdGNd0PszeR3Km8_qkxLhaF2nr7H93hC4qQtEeOxQ5SiI7uowJ7NSDi_nr5gvY9Qg&stp=c0.5000x0.5000f_dst-emg0_p1024x1024_q75_tt6&ur=5fad0e&_nc_sid=58080a&oh=00_AQOzN8V82LiVt8EgibQZ29GhH0lYoKT4tfxqJGImABiCRA&oe=6AE4456F\"},{\"id\":\"120240689548620179\",\"name\":\"omega3-french-focus\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t45.1600-4/662316704_122345968370003577_2594158615469284202_n.png?stp=dst-jpg_tt6&_nc_cat=105&ccb=1-7&_nc_sid=ff4730&_nc_ohc=fuelh3ceOu4Q7kNvwFxPTMl&_nc_oc=AdqrEP4GQmp4Scy0C1QRPGciXNpz6sPpS_T5QVADR2LPRaRFH13l0smcpTsqSyrNnOw&_nc_zt=1&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=1pj3p-HzI371BDeQhr20lg&_nc_tpa=Q5bMBQINzp8UlXMI1TryFh0WxUlWV0cTerkqU_Z81ixdPgJpwVdbHRMLxGvIVbJNmpV2oBTXRPXBRnEtAw&oh=00_AQNmPpSvJEklU7vIIUVpSWZjo0NkDGkV82cCyaOZ5HzTxg&oe=6AE44985\"},{\"id\":\"120238580467310179\",\"name\":\"keratin-flexible\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t45.1600-4/639013456_122339608436003577_783814526943271044_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=ff4730&_nc_ohc=y99TiHzZUKMQ7kNvwEFT3_a&_nc_oc=AdreAVvsZ9UwoCLwLRlAxXKPcweHltNDrwlCxOSIScflAeUk95hrLFr58GISvU8ssso&_nc_zt=1&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=_C6Kurv9I_9kep9y7L5A9g&_nc_tpa=Q5bMBQJsdGeA1nus8gkZ6gsTKAEbVEzVCtELCrPbHmV9pUAlANMyS6UaW8rgz7olbNLXpP9OVV6cvdIo5g&oh=00_AQPY9OQahp2rWy1ZSVly2o1y8vYqaCgQBZ6lEa6GdnNPog&oe=6AE419C2\"},{\"id\":\"120236213009660179\",\"name\":\"omega3-image\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t45.1600-4/608912942_122330005808003577_5141123762514837082_n.png?stp=dst-jpg_tt6&_nc_cat=103&ccb=1-7&_nc_sid=ff4730&_nc_ohc=MOcIxFMwWYAQ7kNvwGS5dW5&_nc_oc=AdqtTpRw9CRKeBxvte8no587USMVz_lMR5PHrodOSts7dPASggYd2-Hs8mx10qIxbwE&_nc_zt=1&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=fCbwTIpNAZgoFFf2JVl00g&_nc_tpa=Q5bMBQIBsigSYMl5W_q9cMy2VBbHlmOqM0zWZz2IZ-Bu-zp111ZDHGSgw4cp5rkKVMOhgaWFx74hwwYmuQ&oh=00_AQMFe0PDB8UhlXVkHYkAXs9uruTFGzEXdNKTIdm0N7N4Sg&oe=6AE43C21\"},{\"id\":\"120248559546940179\",\"name\":\"marine-collagen\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t45.1600-4/831532971_122379080564003577_3299035604683015578_n.png?stp=dst-jpg_tt6&_nc_cat=106&ccb=1-7&_nc_sid=ff4730&_nc_ohc=jyu_OPXTd9UQ7kNvwGu_Kdc&_nc_oc=AdrF1qZHuN5Eam3uoMl-qePHB4KOxujDZ6fekx9aV-5k0uwHOGCWOFelhR5qRju0kQ4&_nc_zt=1&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=VobU8aePpCOhO7NK4X_5dA&_nc_tpa=Q5bMBQJmRj0CqG5aX89Ro4RXfT2SRVZulb3RtoSnDWrmNXfbU9-dJURCLG3OkqZeXYr9KNGMNE-cX8Sg9Q&oh=00_AQMtI9asz5x4qPhEVj8uF4X4e4LW79Bemz_2ylm0pOdMmQ&oe=6AE42E43\"},{\"id\":\"120248679772470179\",\"name\":\"c-zinc-seasonal\",\"url\":\"https://scontent-fra3-2.xx.fbcdn.net/v/t45.1600-4/841140115_122380686704003577_8216968423523809298_n.png?stp=dst-jpg_tt6&_nc_cat=110&ccb=1-7&_nc_sid=ff4730&_nc_ohc=_nzc9DNRNdAQ7kNvwH_9XSS&_nc_oc=Ado3cKgaq47FXYqpaVOQDwwPOs0-3ZcokY7olukOvgOJO6Nx14qb5aqL1KRPD-6aXgk&_nc_zt=1&_nc_ht=scontent-fra3-2.xx&edm=AEuWsiQEAAAA&_nc_gid=t6wAA5pWHCM5Lo5-tVvhZw&_nc_tpa=Q5bMBQK5MlcHNFeJiHhLwJcuKgv3cKtwbMetK-dKb6JWtkWLA8HihgDwHHODRjCpnVUlbvHkLx-nRyK0kw&oh=00_AQOrEeJYojMVf9HyOV5o_s-PZFoGIt9esY4nH8iK7tLZWg&oe=6AE42F05\"}]")
          os.makedirs("assets/meta-ads", exist_ok=True)
          failures = []
          for item in items:
              path = "assets/meta-ads/" + item["name"] + ".jpg"
              try:
                  req = urllib.request.Request(item["url"], headers={"User-Agent": "Mozilla/5.0 (compatible; MetaCreativeArchive/1.0)"})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      payload = response.read()
                  if not (payload.startswith(bytes.fromhex("ffd8ff")) or payload.startswith(bytes.fromhex("89504e47")) or payload.startswith(b"RIFF")):
                      raise RuntimeError("Downloaded response was not a supported image")
                  img = Image.open(io.BytesIO(payload))
                  img = ImageOps.exif_transpose(img).convert("RGB")
                  img.thumbnail((1200, 1200))
                  img.save(path, "JPEG", quality=88, optimize=True, progressive=True)
                  print("ARCHIVED", item["id"], path, os.path.getsize(path))
              except Exception as exc:
                  print("FAILED", item["id"], str(exc))
                  failures.append(item["id"])
          if failures:
              sys.exit("Failed creative IDs: " + ", ".join(failures))
          
          PY
      - name: Commit stable image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meta-ads/*.jpg
          if ! git diff --staged --quiet; then
            git commit -m "Archive original Meta ads preview images locally"
            git push origin HEAD:portfolio-growth-marketing-20261025
          fi
